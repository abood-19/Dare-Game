<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B0D22">
<title>Truth or Dare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='14' y='8' width='36' height='48' rx='7' fill='%23F0306F' transform='rotate(-10 32 32)'/><rect x='14' y='8' width='36' height='48' rx='7' fill='%23FFF4E6'/><text x='32' y='42' font-size='26' text-anchor='middle' font-family='Arial' font-weight='900' fill='%231B0D22'>?</text></svg>">
<style>
:root{
  --bg:#1B0D22; --bg2:#26122F; --surf:#2F183A; --surf2:#3B2148; --line:rgba(255,226,250,.12);
  --txt:#F7EAF8; --mute:#B99CC3; --paper:#FFF4E6; --ink:#2A1230;
  --light:#3FD3A6; --medium:#FFB547; --spicy:#FF7A55; --hot:#F0306F;
  --c:var(--light); --r-lg:22px; --r-md:14px; --r-sm:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Rubik',system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;
  background-image:radial-gradient(120% 60% at 50% -10%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);
  transition:background-color .4s}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--medium);outline-offset:2px}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.screen{flex:1;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:20px 18px calc(24px + var(--safe-b))}
.screen.on{display:flex}
.wrap{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;flex:1}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;min-height:44px}
.bar h2{flex:1;font-size:1.25rem;font-weight:800;text-align:center}
.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surf);border:1px solid var(--line);font-size:1.1rem;position:relative;flex-shrink:0}
.icon:active{transform:scale(.94)}
.icon .badge{position:absolute;top:-3px;inset-inline-end:-3px;min-width:19px;height:19px;border-radius:10px;background:var(--hot);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
[dir=rtl] .flip{transform:scaleX(-1)}

/* lang chips */
.langs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.langs button{padding:7px 13px;border-radius:30px;border:1px solid var(--line);font-size:.85rem;color:var(--mute);background:var(--bg2)}
.langs button.sel{background:var(--txt);color:var(--bg);border-color:var(--txt);font-weight:700}

/* home hero: a fanned hand of four category cards */
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 0 8px}
.fan{position:relative;width:200px;height:170px;margin-bottom:14px}
.fan i{position:absolute;left:50%;bottom:0;width:92px;height:132px;margin-left:-46px;border-radius:14px;transform-origin:50% 120%;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:deal .9s cubic-bezier(.2,.9,.25,1.2) backwards}
.fan i:nth-child(1){background:var(--light);transform:rotate(-27deg);animation-delay:.05s}
.fan i:nth-child(2){background:var(--medium);transform:rotate(-9deg);animation-delay:.15s}
.fan i:nth-child(3){background:var(--spicy);transform:rotate(9deg);animation-delay:.25s}
.fan i:nth-child(4){background:var(--hot);transform:rotate(27deg);animation-delay:.35s;display:grid;place-items:center;font-style:normal;font-size:3rem;font-weight:900;color:var(--paper)}
@keyframes deal{from{transform:rotate(0) translateY(40px);opacity:0}}
.logo{font-size:clamp(2.1rem,9vw,2.9rem);font-weight:900;line-height:1.05;text-align:center;letter-spacing:-.01em}
.tag{color:var(--mute);text-align:center;font-size:.98rem}

/* big choices */
.choice{display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--r-lg);background:var(--surf);border:1px solid var(--line);text-align:start;width:100%}
.choice:active{transform:scale(.98)}
.choice .em{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;flex-shrink:0}
.choice b{display:block;font-size:1.12rem;font-weight:800}
.choice small{color:var(--mute);font-size:.86rem}
.choice.primary{background:var(--paper);color:var(--ink);border-color:transparent}
.choice.primary small{color:#7B5A80}
.linkbtn{color:var(--mute);text-decoration:underline;text-underline-offset:3px;font-size:.9rem;align-self:center;padding:8px}

/* buttons */
.btn{min-height:52px;padding:0 20px;border-radius:var(--r-md);font-weight:700;font-size:1.02rem;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--surf2);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--paper);color:var(--ink);border:0}
.btn.accent{background:var(--c);color:var(--ink);border:0}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* inputs */
.field{display:flex;gap:8px;align-items:center}
.inp{width:100%;min-height:52px;padding:0 16px;border-radius:var(--r-md);background:var(--bg2);border:1.5px solid var(--line);outline:none;font-size:1rem}
.inp:focus{border-color:var(--paper)}
.inp::placeholder{color:#8E7298}
.code-inp{text-align:center;font-size:1.5rem;font-weight:800;letter-spacing:.35em;text-transform:uppercase}
.lbl{font-size:.88rem;color:var(--mute);font-weight:500}
.sep{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:.85rem}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
.del{width:44px;height:44px;border-radius:12px;background:var(--bg2);color:var(--mute);flex-shrink:0;font-size:1.1rem}

/* categories */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{position:relative;border-radius:var(--r-lg);padding:18px 14px 16px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;text-align:start;color:var(--ink);overflow:hidden}
.cat:active{transform:scale(.97)}
.cat .ce{position:absolute;top:12px;inset-inline-start:14px;font-size:2rem}
.cat b{font-size:1.2rem;font-weight:800}
.cat small{font-size:.82rem;opacity:.78}
.cat .cn{position:absolute;top:14px;inset-inline-end:14px;font-size:.75rem;font-weight:700;background:rgba(0,0,0,.14);padding:3px 9px;border-radius:20px}
.cat.sel{outline:3px solid var(--txt);outline-offset:3px}

/* lobby */
.code-card{background:var(--paper);color:var(--ink);border-radius:var(--r-lg);padding:18px;text-align:center}
.code-card .big{font-size:2.6rem;font-weight:900;letter-spacing:.3em;margin-inline-start:.3em}
.plist{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);background:var(--surf);border:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--ink);flex-shrink:0}
.pl .nm{flex:1;font-weight:600}
.pill{font-size:.72rem;padding:3px 9px;border-radius:20px;background:var(--surf2);color:var(--mute);white-space:nowrap}
.hint{color:var(--mute);font-size:.88rem;text-align:center;line-height:1.6}

/* game */
#game{padding-top:12px}
.catchip{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:30px;background:var(--surf);border:1px solid var(--line);font-weight:700;font-size:.95rem}
.catchip i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.turn{text-align:center;padding:4px 0}
.turn .who{font-size:1.5rem;font-weight:800}
.turn .sub{color:var(--mute);font-size:.9rem;margin-top:2px}
.turn.me .who{color:var(--c)}
.stage{position:relative;flex:1;min-height:300px;display:flex;align-items:center;justify-content:center;padding:10px 4px 22px}
.stack{position:relative;width:100%;max-width:400px;aspect-ratio:3/3.6;max-height:440px}
.stack:before,.stack:after{content:"";position:absolute;inset:0;border-radius:26px;background:var(--c);opacity:.5}
.stack:before{transform:rotate(-4deg) translateY(10px)}
.stack:after{transform:rotate(3deg) translateY(6px);opacity:.75}
.card{position:absolute;inset:0;z-index:2;border-radius:26px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.4);touch-action:pan-y;user-select:none}
.card.anim{animation:flipIn .45s cubic-bezier(.2,.8,.3,1)}
@keyframes flipIn{from{transform:rotateY(80deg) scale(.92);opacity:.3}}
.card .ty{align-self:flex-start;padding:6px 14px;border-radius:30px;font-weight:800;font-size:.92rem;background:var(--c);color:var(--ink)}
.card .ty.d{background:var(--ink);color:var(--paper)}
.card .q{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(1.25rem,5.4vw,1.6rem);font-weight:700;line-height:1.5;padding:10px 0;overflow-y:auto}
.card .ft{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:#866A8C;font-weight:500}
.card .res{font-weight:700}
.card.empty .q{flex-direction:column;gap:6px;color:#866A8C;font-size:1.1rem}
.card.empty .q b{font-size:3.4rem;color:var(--ink)}
.blur .q{filter:blur(9px)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick .btn{min-height:64px;font-size:1.15rem}
.pick .t{background:var(--c);color:var(--ink);border:0}
.pick .d{background:var(--paper);color:var(--ink);border:0}
.pick .r{grid-column:1/-1;min-height:46px;font-size:.95rem;background:transparent}
.acts{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.acts .btn{min-height:56px;font-size:.95rem;padding:0 8px}
.nav{display:flex;align-items:center;gap:8px}
.nav .btn{min-height:44px;font-size:.88rem;flex:1}
.nav .pos{font-size:.82rem;color:var(--mute);min-width:90px;text-align:center}
.scores{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.scores::-webkit-scrollbar{display:none}
.sc{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:30px;background:var(--surf);border:1px solid var(--line);font-size:.88rem}
[dir=rtl] .sc{padding:6px 6px 6px 12px}
.sc .av{width:28px;height:28px;font-size:.8rem}
.sc.cur{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--surf))}
.sc .talk{width:8px;height:8px;border-radius:50%;background:var(--light);box-shadow:0 0 0 4px rgba(63,211,166,.3);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(63,211,166,.1)}}

/* sheets & modals */
.veil{position:fixed;inset:0;background:rgba(10,3,14,.6);backdrop-filter:blur(3px);z-index:50;display:none}
.veil.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:560px;margin:0 auto;background:var(--bg2);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;padding:10px 16px calc(16px + var(--safe-b));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;gap:12px;max-height:88vh}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h3{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:10px}
.sheet h3 span{flex:1}
.modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.modal .box h3{font-size:1.3rem;font-weight:800}
.modal .box p{color:var(--mute);line-height:1.65}

/* chat */
#chatSheet{height:80vh}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.msg{max-width:82%;align-self:flex-start;display:flex;flex-direction:column;gap:3px}
.msg.mine{align-self:flex-end}
.msg .by{font-size:.74rem;color:var(--mute);padding:0 6px}
.msg .bub{background:var(--surf2);padding:10px 14px;border-radius:18px;line-height:1.55;word-wrap:break-word;white-space:pre-wrap}
.msg.mine .bub{background:var(--paper);color:var(--ink)}
.msg .tr{font-size:.78rem;color:var(--mute);padding:0 6px;display:flex;gap:10px}
.msg .tr button{color:var(--medium);font-size:.78rem;text-decoration:underline;text-underline-offset:2px}
.msg .orig{font-size:.8rem;opacity:.7;border-top:1px dashed rgba(127,100,140,.4);margin-top:6px;padding-top:5px}
.msg.sys{align-self:center;font-size:.78rem;color:var(--mute);background:transparent}
.chat-empty{margin:auto;color:var(--mute);text-align:center}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:52px;max-height:130px;resize:none;padding:14px 16px;border-radius:26px;background:var(--surf);border:1.5px solid var(--line);outline:none;line-height:1.4;font-size:1rem}
.composer textarea:focus{border-color:var(--paper)}
.sendb{width:52px;height:52px;border-radius:50%;background:var(--paper);color:var(--ink);font-size:1.25rem;flex-shrink:0;display:grid;place-items:center}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick button{padding:6px 12px;border-radius:20px;background:var(--surf);border:1px solid var(--line);font-size:1.05rem;flex-shrink:0}
.toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute)}
.sw{width:40px;height:24px;border-radius:12px;background:var(--surf2);position:relative;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:var(--mute);transition:.2s}
.sw.on{background:var(--light)}
.sw.on:after{inset-inline-start:19px;background:#fff}

/* voice dock */
.vdock{display:none;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-lg);background:var(--surf);border:1px solid var(--line)}
.vdock.on{display:flex}
#vdock{position:sticky;bottom:calc(-24px - var(--safe-b));z-index:5;margin:0 -6px;box-shadow:0 -10px 30px rgba(10,3,14,.55)}
.ptt{width:66px;height:66px;border-radius:50%;background:var(--light);color:var(--ink);font-size:1.7rem;flex-shrink:0;display:grid;place-items:center;box-shadow:0 0 0 0 rgba(63,211,166,.5);transition:transform .1s;touch-action:none;user-select:none;-webkit-user-select:none}
.ptt.live{transform:scale(1.08);box-shadow:0 0 0 10px rgba(63,211,166,.25);background:#7DF0C8}
.ptt.open{background:var(--hot);color:#fff}
.vinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.vinfo .st{font-weight:700;font-size:.95rem}
.vinfo .who{font-size:.8rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--bg2);border-radius:20px;padding:3px;align-self:flex-start}
.seg button{padding:5px 11px;border-radius:16px;font-size:.78rem;color:var(--mute)}
.seg button.sel{background:var(--surf2);color:var(--txt);font-weight:700}

.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-160%);z-index:90;background:var(--paper);color:var(--ink);padding:11px 18px;border-radius:30px;font-weight:600;font-size:.92rem;transition:transform .3s;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.on{transform:translate(-50%,0)}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--paper);border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (min-height:760px){.stage{min-height:360px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

<!-- HOME -->
<section class="screen on" id="home"><div class="wrap">
  <div class="langs" id="langs"></div>
  <div class="hero">
    <div class="fan" aria-hidden="true"><i></i><i></i><i></i><i>?</i></div>
    <h1 class="logo" data-t="name"></h1>
    <p class="tag" data-t="tagline"></p>
  </div>
  <button class="choice primary" data-go="setup"><span class="em" style="background:var(--light)">📱</span><span><b data-t="local"></b><small data-t="localSub"></small></span></button>
  <button class="choice" data-go="online"><span class="em" style="background:var(--hot)">🌍</span><span><b data-t="online"></b><small data-t="onlineSub"></small></span></button>
  <button class="linkbtn" data-act="rules" data-t="rules"></button>
</div></section>

<!-- LOCAL SETUP -->
<section class="screen" id="setup"><div class="wrap">
  <div class="bar"><button class="icon" data-go="home" aria-label="back"><span class="flip">←</span></button><h2 data-t="players"></h2><span style="width:44px"></span></div>
  <div class="plist" id="localList"></div>
  <button class="btn" data-act="addLocal">＋ <span data-t="addPlayer"></span></button>
  <div style="flex:1"></div>
  <p class="hint" id="setupHint"></p>
  <button class="btn main" data-act="localStart" data-t="start"></button>
</div></section>

<!-- ONLINE ENTRY -->
<section class="screen" id="online"><div class="wrap">
  <div class="bar"><button class="icon" data-go="home" aria-label="back"><span class="flip">←</span></button><h2 data-t="online"></h2><span style="width:44px"></span></div>
  <label class="lbl" for="myName" data-t="yourName"></label>
  <input class="inp" id="myName" maxlength="18" autocomplete="nickname">
  <button class="btn main" data-act="create" data-t="create"></button>
  <div class="sep" data-t="or"></div>
  <input class="inp code-inp" id="codeIn" maxlength="5" autocomplete="off" autocapitalize="characters">
  <button class="btn" data-act="join" data-t="join"></button>
  <p class="hint" data-t="online_hint"></p>
</div></section>

<!-- LOBBY -->
<section class="screen" id="lobby"><div class="wrap">
  <div class="bar"><button class="icon" data-act="leave" aria-label="leave"><span class="flip">←</span></button><h2 data-t="waiting"></h2><button class="icon" data-act="chat" aria-label="chat">💬<span class="badge" hidden></span></button></div>
  <div class="code-card"><div class="lbl" style="color:#7B5A80" data-t="roomCode"></div><div class="big" id="lobbyCode">-----</div></div>
  <button class="btn" data-act="share">🔗 <span data-t="share"></span></button>
  <div class="plist" id="lobbyList"></div>
  <div style="flex:1"></div>
  <div class="vdock" id="vdockLobby"></div>
  <button class="btn" data-act="voice" id="voiceBtnLobby">🎙 <span data-t="joinVoice"></span></button>
  <button class="btn main" data-act="lobbyStart" id="lobbyStart" data-t="startGame"></button>
  <p class="hint" id="lobbyHint"></p>
</div></section>

<!-- CATEGORIES -->
<section class="screen" id="cats"><div class="wrap">
  <div class="bar"><button class="icon" data-act="catsBack" aria-label="back"><span class="flip">←</span></button><h2 data-t="chooseCat"></h2><span style="width:44px"></span></div>
  <div class="cats" id="catGrid"></div>
  <div style="flex:1"></div>
  <button class="btn" data-act="openAddQ">＋ <span data-t="addQ"></span></button>
</div></section>

<!-- GAME -->
<section class="screen" id="game"><div class="wrap" style="gap:12px">
  <div class="bar">
    <button class="icon" data-act="leave" aria-label="leave">✕</button>
    <button class="catchip" data-act="changeCat"><i></i><span id="catName"></span><small style="color:var(--mute)">▾</small></button>
    <button class="icon olonly" data-act="voice" id="voiceIcon" aria-label="voice">🎙</button>
    <button class="icon olonly" data-act="chat" aria-label="chat">💬<span class="badge" hidden></span></button>
    <button class="icon" data-act="scores" aria-label="scores">🏆</button>
  </div>
  <div class="scores" id="scores"></div>
  <div class="turn" id="turn"><div class="who"></div><div class="sub"></div></div>
  <div class="stage"><div class="stack"><div class="card" id="card"></div></div></div>
  <div class="nav" id="nav"></div>
  <div id="controls"></div>
  <div class="vdock" id="vdock"></div>
</div></section>
</div>

<!-- CHAT SHEET -->
<div class="veil" id="veil" data-act="closeSheets"></div>
<div class="sheet" id="chatSheet" role="dialog">
  <div class="grab"></div>
  <h3><span data-t="chat"></span><button class="toggle" data-act="autoTr"><span data-t="autoTr"></span><i class="sw" id="trSw"></i></button><button class="icon" data-act="closeSheets" style="width:36px;height:36px">✕</button></h3>
  <div class="msgs" id="msgs"></div>
  <div class="quick" id="quick"></div>
  <div class="composer"><textarea id="chatIn" rows="1"></textarea><button class="sendb" data-act="send" aria-label="send"><span class="flip">➤</span></button></div>
</div>
<div class="sheet" id="catSheet" role="dialog"><div class="grab"></div><h3><span data-t="changeCat"></span></h3><div class="cats" id="catGrid2"></div></div>

  <div class="row"><button class="btn" data-act="reset" data-t="playAgain"></button><button class="btn main" data-act="leave" data-t="endGame"></button></div></div>

  <div class="cats" id="addCats" style="grid-template-columns:repeat(4,1fr)"></div>
  <div class="row" id="addType"></div>
  <textarea class="inp" id="addText" rows="3" style="padding:14px;min-height:96px;resize:none"></textarea>
  <button class="btn main" data-act="saveQ" data-t="save"></button></div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="i18n.js"></script>
<script src="q_light.js"></script><script src="q_medium.js"></script><script src="q_spicy.js"></script><script src="q_hot.js"></script>
<script src="peerjs.min.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const CATS=['light','medium','spicy','hot'], EMO={light:'😄',medium:'💭',spicy:'🙈',hot:'🔥'};
const AVC=['#3FD3A6','#FFB547','#FF7A55','#F0306F','#8FB8FF','#C79BFF','#FFE16B','#7FE0E0'];
const store={get(k,d){try{const v=localStorage.getItem('dare_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('dare_'+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ───────── language: phone language by default, remembered after a manual pick ───────── */
function detectLang(){
  const saved=store.get('lang',null); if(saved&&LANGS.includes(saved)) return saved;
  for(const l of (navigator.languages||[navigator.language||'en'])){const b=String(l).slice(0,2).toLowerCase(); if(LANGS.includes(b)) return b;}
  return 'en';
}
let L=detectLang();
const t=(k,v={})=>{let s=(T[L]&&T[L][k])??T.en[k]??k; for(const x in v) s=s.replace('{'+x+'}',v[x]); return s;};
function applyLang(){
  document.documentElement.lang=L; document.documentElement.dir=L==='ar'?'rtl':'ltr';
  document.title=t('name');
  $$('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $('#langs').innerHTML=LANGS.map(l=>`<button class="${l===L?'sel':''}" data-lang="${l}">${LANG_NAMES[l]}</button>`).join('');
  $('#myName').placeholder=t('yourName'); $('#codeIn').placeholder=t('codePh'); $('#chatIn').placeholder=t('typeMsg'); $('#addText').placeholder=t('addQPh');
  renderAll();
}
function setLang(l){L=l;store.set('lang',l);applyLang(); if(NET.role) sendAct({a:'lang',lang:l});}

/* ───────── sound & haptics ───────── */
let actx=null, soundOn=store.get('sound',true);
function beep(kind){ if(!soundOn) return; try{actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended')actx.resume();
  const seq={tap:[[520,.06]],card:[[440,.07],[660,.09]],done:[[523,.08],[659,.08],[784,.14]],pass:[[330,.12],[247,.16]],msg:[[880,.05],[1175,.07]]}[kind]||[[500,.05]];
  let tt=actx.currentTime; seq.forEach(([f,d])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(.22,tt+.01);g.gain.exponentialRampToValueAtTime(.0001,tt+d);o.connect(g).connect(actx.destination);o.start(tt);o.stop(tt+d+.02);tt+=d;});
}catch(e){} }
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

/* ───────── screens / toast / modal ───────── */
let cur='home';
function go(id){ cur=id; $$('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); closeSheets(); renderAll(); }
let toastT; function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2600);}
function modal(html){ $('#modalBox').innerHTML=html; $('#modal').classList.add('on'); $('#veil').classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); if(!$$('.sheet.on').length) $('#veil').classList.remove('on'); }
function openSheet(id){ closeSheets(); $('#'+id).classList.add('on'); $('#veil').classList.add('on'); }
function closeSheets(){ $$('.sheet').forEach(s=>s.classList.remove('on')); $('#modal').classList.remove('on'); $('#veil').classList.remove('on'); chatOpen=false; }

/* ───────── questions & decks ───────── */
let custom=store.get('custom',{light:[],medium:[],spicy:[],hot:[]});
const LI=()=>LANGS.indexOf(L)+1; // column of the current language in a question row [type, ar, en, ru, uz]
function cardText(c){ if(!c) return ''; if(c.x!=null) return c.x; const row=Q[c.c][c.i]; return row[1+['ar','en','ru','uz'].indexOf(L)]||row[2]; }
const decks={};
function draw(cat,ty){
  const key=cat+ty;
  if(!decks[key]||!decks[key].length){
    const pool=[]; Q[cat].forEach((r,i)=>{if(r[0]===ty) pool.push({c:cat,i,ty})});
    (custom[cat]||[]).forEach(q=>{if(q.ty===ty) pool.push({c:cat,x:q.x,ty})});
    for(let i=pool.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pool[i],pool[j]]=[pool[j],pool[i]]}
    decks[key]=pool;
  }
  return decks[key].pop();
}
const catCount=c=>Q[c].length+(custom[c]||[]).length;

/* ───────── shared game state (local = I am the host of myself) ───────── */
let S=freshState();
function freshState(){return {cat:'light',players:[],turn:0,card:null,hist:[],started:false,seq:0};}
let viewIdx=null; // null = live card, otherwise index in S.hist being reviewed
let ageOk=false, lastCardSeq=-1;
const me=()=>NET.role?NET.id:null;
const curP=()=>S.players[S.turn%Math.max(1,S.players.length)];

function apply(a,from){
  const host=!NET.role||NET.role==='host';
  if(!host) return;
  const isHostAct=!NET.role||from===NET.id, isTurn=curP()&&curP().id===from;
  const p=S.players.find(x=>x.id===from);
  switch(a.a){
    case 'lang': if(p) p.lang=a.lang; break;
    case 'voice': if(p) p.v=!!a.on; break;
    case 'cat': if(!isHostAct) return; S.cat=a.c; S.card=null; break;
    case 'start': if(!isHostAct) return; S.started=true; break;
    case 'reset': if(!isHostAct) return; S.players.forEach(x=>x.score=0); S.hist=[]; S.card=null; S.turn=0; break;
    case 'pick': if(!(isHostAct||isTurn)||S.card) return;
      { const ty=a.ty==='r'?(Math.random()<.6?'t':'d'):a.ty; S.card=draw(S.cat,ty); S.hist.push({card:S.card,pid:curP().id,res:null}); S.seq++; } break;
    case 'skip': if(!(isHostAct||isTurn)||!S.card) return;
      S.card=draw(S.cat,S.card.ty); S.hist[S.hist.length-1].card=S.card; S.seq++; break;
    case 'done': case 'pass': if(!(isHostAct||isTurn)||!S.card) return;
      if(a.a==='done') curP().score++;
      S.hist[S.hist.length-1].res=a.a; S.card=null; S.turn=(S.turn+1)%S.players.length; break;
  }
  if(S.hist.length>200) S.hist=S.hist.slice(-200);
  if(NET.role==='host') broadcast({k:'state',s:S});
  renderAll();
}
function sendAct(a){
  if(NET.role==='guest'){ NET.conn&&NET.conn.open&&NET.conn.send({k:'act',a}); }
  else apply(a, NET.role?NET.id:null);
}
function act(a){ // action from the UI, with turn check for online guests
  if(['pick','skip','done','pass'].includes(a.a)&&NET.role&&NET.role!=='host'&&curP()&&curP().id!==NET.id){toast(t('notTurn'));return;}
  if(a.a==='done') {beep('done');buzz(40);} else if(a.a==='pass'){beep('pass');buzz([30,40,30]);} else beep('card');
  viewIdx=null; sendAct(a);
}

const maxReview=()=>S.hist.length-(S.card?2:1); // last index you can review (the live card is excluded)
function goPrev(){ const m=maxReview(); if(m<0) return; viewIdx=viewIdx==null?m:Math.max(0,viewIdx-1); }
/* ───────── rendering ───────── */
const avatar=(p,i)=>`<span class="av" style="background:${AVC[i%AVC.length]}">${esc((p.name||'?').trim().charAt(0).toUpperCase())}</span>`;
function setCatColor(){ document.documentElement.style.setProperty('--c',`var(--${S.cat})`); }
function renderAll(){
  setCatColor();
  if(cur==='setup') renderSetup();
  if(cur==='lobby') renderLobby();
  if(cur==='cats') renderCats('#catGrid');
  if(cur==='game') renderGame();
  renderVoice(); renderBadges();
}
function catTiles(sel){return CATS.map(c=>`<button class="cat ${sel===c?'sel':''}" data-cat="${c}" style="background:var(--${c})"><span class="ce">${EMO[c]}</span><span class="cn">${t('count',{n:catCount(c)})}</span><b>${t('cat_'+c)}</b><small>${t('catd_'+c)}</small></button>`).join('');}
function renderCats(where){ $(where).innerHTML=catTiles(S.cat); }

let localNames=store.get('names',['','']);
function renderSetup(){
  $('#localList').innerHTML=localNames.map((n,i)=>`<div class="field">${avatar({name:n||String(i+1)},i)}<input class="inp" data-pi="${i}" value="${esc(n)}" placeholder="${esc(t('playerPh'))} ${i+1}" maxlength="18">${localNames.length>2?`<button class="del" data-del="${i}" aria-label="remove">✕</button>`:''}</div>`).join('');
  $('#setupHint').textContent=t('rulesText');
}
function renderLobby(){
  $('#lobbyCode').textContent=NET.code||'-----';
  $('#lobbyList').innerHTML=S.players.map((p,i)=>`<div class="pl">${avatar(p,i)}<span class="nm">${esc(p.name)}</span>${p.v?`<span class="pill">🎙 ${t('inVoice')}</span>`:''}<span class="pill">${LANG_NAMES[p.lang]||''}</span>${i===0?`<span class="pill">${t('host')}</span>`:''}${p.id===NET.id?`<span class="pill">${t('you')}</span>`:''}</div>`).join('');
  const host=NET.role==='host';
  $('#lobbyStart').style.display=host?'':'none';
  $('#lobbyStart').disabled=S.players.length<2;
  $('#lobbyHint').textContent=host?(S.players.length<2?t('minPlayers'):''):t('waitHost');
}
function renderGame(){
  $$('.olonly').forEach(e=>e.style.display=NET.role?'':'none');
  $('#catName').textContent=EMO[S.cat]+' '+t('cat_'+S.cat);
  const cp=curP(); const mine=NET.role&&cp&&cp.id===NET.id;
  renderScoresBar();
  const tu=$('#turn'); tu.classList.toggle('me',!!mine);
  tu.querySelector('.who').textContent=mine?t('yourTurn'):t('turn',{name:cp?cp.name:''});
  tu.querySelector('.sub').textContent=S.card?'':t('chooseType');
  // card: live or history
  const hist=S.hist, reviewing=viewIdx!=null&&hist[viewIdx];
  const card=$('#card'); const shown=reviewing?hist[viewIdx].card:S.card;
  const needGate=S.cat==='hot'&&!ageOk&&!reviewing;
  card.className='card'+(shown?'':' empty')+(needGate&&shown?' blur':'');
  if(shown){
    const pl=S.players.find(p=>p.id===(reviewing?hist[viewIdx].pid:cp&&cp.id));
    const res=reviewing&&hist[viewIdx].res;
    card.innerHTML=`<span class="ty ${shown.ty}">${shown.ty==='t'?t('truth'):t('dare')}</span><div class="q">${esc(cardText(shown))}</div><div class="ft"><span>${esc(pl?pl.name:'')}</span><span class="res">${res==='done'?'✓ '+t('done').replace('✓','').trim():res==='pass'?'✗ '+t('pass'):EMO[shown.c]+' '+t('cat_'+shown.c)}</span></div>`;
  } else card.innerHTML=`<div class="q"><b>?</b>${esc(t('chooseType'))}</div>`;
  const seqKey=reviewing?'h'+viewIdx:'s'+S.seq;
  if(shown&&seqKey!==lastCardSeq){card.classList.remove('anim');void card.offsetWidth;card.classList.add('anim');}
  lastCardSeq=seqKey;
  // history nav
  const n=hist.length, mr=maxReview();
  const posTxt=reviewing?t('histPos',{i:viewIdx+1,n}):(S.card?t('histPos',{i:n,n}):'');
  $('#nav').innerHTML=mr>=0?`<button class="btn" data-act="prev" ${reviewing&&viewIdx===0?'disabled':''}><span class="flip">‹</span> ${t('prev')}</button><span class="pos">${posTxt}</span><button class="btn" data-act="next" ${!reviewing?'disabled':''}>${t('next')} <span class="flip">›</span></button>`:'';
  // controls
  const canAct=!NET.role||NET.role==='host'||mine;
  let c='';
  if(reviewing) c=`<button class="btn accent" data-act="live">${t('live')}</button>`;
  else if(!S.card) c=canAct?`<div class="pick"><button class="btn t" data-pick="t">${t('truth')}</button><button class="btn d" data-pick="d">${t('dare')}</button><button class="btn r" data-pick="r">🎲 ${t('random')}</button></div>`:`<p class="hint">${t('turn',{name:cp?esc(cp.name):''})}</p>`;
  else c=canAct?`<div class="acts"><button class="btn" data-act="pass">✗ ${t('pass')}</button><button class="btn accent" data-act="done">${t('done')}</button><button class="btn" data-act="skip">↻ ${t('skip')}</button></div>`:`<p class="hint">${t('turn',{name:cp?esc(cp.name):''})}</p>`;
  $('#controls').innerHTML=c;
  if(needGate&&shown&&!$('#modal').classList.contains('on')) ageGate(()=>renderAll(),()=>{ if(!NET.role||NET.role==='host') act({a:'cat',c:'light'}); else renderAll(); });
}
function renderScoresBar(){ $('#scores').innerHTML=S.players.map((p,i)=>`<div class="sc ${i===S.turn?'cur':''}">${avatar(p,i)}<span>${esc(p.name)}</span><b>${p.score}</b>${talking.has(p.id)?'<i class="talk"></i>':''}</div>`).join(''); }
function renderScores(){
  const arr=S.players.map((p,i)=>({p,i})).sort((a,b)=>b.p.score-a.p.score);
  $('#scoreList').innerHTML=(arr.length&&arr[0].p.score>0?`<p class="hint" style="font-size:1.05rem;color:var(--txt)">${esc(t('winner',{name:arr[0].p.name}))}</p>`:'')+arr.map(({p,i})=>`<div class="pl">${avatar(p,i)}<span class="nm">${esc(p.name)}</span><b>${p.score} ${t('points')}</b></div>`).join('');
  $('#scoreSheet [data-act=reset]').style.display=(!NET.role||NET.role==='host')?'':'none';
}
function renderBadges(){ $$('[data-act=chat] .badge').forEach(b=>{b.hidden=!unread;b.textContent=unread;}); }

function ageGate(ok,no){
  modal(`<div style="font-size:2.6rem">🔞</div><h3>${t('ageTitle')}</h3><p>${t('ageText')}</p><button class="btn main" data-act="ageYes">${t('ageYes')}</button><button class="btn" data-act="ageNo">${t('ageNo')}</button>`);
  ageCb={ok,no};
}
let ageCb=null;
function chooseCat(c){
  const doIt=()=>{ if(NET.role==='guest'){toast(t('waitHost'));return;} act({a:'cat',c}); closeSheets(); if(cur==='cats'){ if(!NET.role||NET.role==='host'){ if(NET.role==='host'&&!S.started) sendAct({a:'start'}); go('game'); } } };
  if(c==='hot'&&!ageOk) ageGate(()=>{doIt()},()=>{}); else doIt();
}

/* ───────── local game ───────── */
function startLocal(){
  $$('#localList input').forEach(i=>localNames[+i.dataset.pi]=i.value.trim());
  const names=localNames.map((n,i)=>n||`${t('playerPh')} ${i+1}`);
  store.set('names',localNames);
  leaveNet(); S=freshState(); S.players=names.map((n,i)=>({id:'p'+i,name:n,score:0,lang:L})); S.started=true;
  go('cats');
}

/* ───────── online: rooms over WebRTC (PeerJS) ───────── */
const PREFIX='truthordare-lgz-';
const qs=new URLSearchParams(location.search);
const PEER_OPTS=(()=>{const o={debug:0,config:{iceServers:[
  {urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},
  {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
  {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}]}};
  if(qs.get('peerhost')){o.host=qs.get('peerhost');o.port=+(qs.get('peerport')||9000);o.path='/';o.secure=false;}
  return o;})();
const NET={role:null,peer:null,conn:null,conns:new Map(),id:null,code:null};
const genCode=()=>Array.from({length:5},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');
function myName(){const n=$('#myName').value.trim(); store.set('myname',n); return n;}
function needName(){ if(!myName()){ $('#myName').focus(); $('#myName').style.borderColor='var(--hot)'; toast(t('yourName')); return true;} return false; }
function busy(on){ $$('#online .btn').forEach(b=>b.disabled=on); if(on) toast(t('connecting')); }

function createRoom(tries=0){
  if(needName()) return; leaveNet(); busy(true);
  const code=genCode(); const peer=new Peer(PREFIX+code,PEER_OPTS);
  NET.peer=peer;
  peer.on('open',id=>{ NET.role='host'; NET.id=id; NET.code=code; busy(false);
    S=freshState(); S.players=[{id,name:myName(),score:0,lang:L,v:false}]; chat=[]; startHeartbeat(); history.replaceState(null,'','?room='+code+(qs.get('peerhost')?`&peerhost=${qs.get('peerhost')}&peerport=${qs.get('peerport')||9000}`:'')); go('lobby'); });
  peer.on('connection',conn=>{
    conn.on('data',d=>hostRecv(conn,d));
    conn.on('close',()=>dropGuest(conn.peer));
    conn.on('error',()=>dropGuest(conn.peer));
  });
  peer.on('call',onCall);
  peer.on('disconnected',()=>{ try{peer.reconnect()}catch(e){} });
  peer.on('error',e=>{ if(e.type==='unavailable-id'&&tries<3){ peer.destroy(); createRoom(tries+1); return;} if(NET.role!=='host'){busy(false);toast(t('connFail'));} });
}
function hostRecv(conn,d){
  if(!d||typeof d!=='object') return;
  lastSeen.set(conn.peer,Date.now());
  if(d.k==='pong') return;
  if(d.k==='bye'){ dropGuest(conn.peer); return; }
  if(d.k==='hello'){
    NET.conns.set(conn.peer,conn);
    if(!S.players.find(p=>p.id===conn.peer)) S.players.push({id:conn.peer,name:String(d.name||'?').slice(0,18),score:0,lang:LANGS.includes(d.lang)?d.lang:'en',v:false});
    conn.send({k:'welcome',code:NET.code,chat:chat.slice(-50)});
    sys('joined',String(d.name||'?').slice(0,18)); broadcast({k:'state',s:S}); renderAll(); beep('msg');
  } else if(d.k==='act'&&d.a) apply(d.a,conn.peer);
  else if(d.k==='chat'){ const p=S.players.find(x=>x.id===conn.peer); if(!p) return; const m={id:Date.now()+Math.random(),from:p.id,name:p.name,lang:p.lang,text:String(d.text).slice(0,600)}; addMsg(m); broadcast({k:'chat',m}); }
  else if(d.k==='talk'){ setTalk(conn.peer,d.on); broadcast({k:'talk',id:conn.peer,on:d.on},conn.peer); }
}
function dropGuest(id){
  if(!NET.conns.has(id)) return; NET.conns.delete(id);
  const i=S.players.findIndex(p=>p.id===id); if(i<0) return;
  const name=S.players[i].name; S.players.splice(i,1);
  if(S.turn>=S.players.length) S.turn=0; else if(i<S.turn) S.turn--;
  hangup(id); talking.delete(id); sys('left',name); broadcast({k:'state',s:S}); renderAll();
}
const lastSeen=new Map(); let hbTimer=null;
function startHeartbeat(){ clearInterval(hbTimer); hbTimer=setInterval(()=>{
  if(NET.role==='host'){ broadcast({k:'ping'}); const now=Date.now(); [...NET.conns.keys()].forEach(id=>{ if(now-(lastSeen.get(id)||now)>12000) dropGuest(id); }); }
  else if(NET.role==='guest'){ if(NET.conn&&NET.conn.open) NET.conn.send({k:'pong'}); if(Date.now()-(lastSeen.get('host')||Date.now())>12000) hostGone(); }
},3000); }
function hostGone(){ if(NET.role!=='guest') return; toast(t('hostLeft')); leaveNet(); S=freshState(); go('home'); }
function broadcast(msg,except){ NET.conns.forEach((c,id)=>{ if(id!==except&&c.open) try{c.send(msg)}catch(e){} }); }

function joinRoom(codeArg){
  if(needName()) return;
  const code=(codeArg||$('#codeIn').value).trim().toUpperCase(); if(code.length<4){ $('#codeIn').focus(); toast(t('codePh')); return; }
  leaveNet(); busy(true);
  const peer=new Peer(PEER_OPTS); NET.peer=peer; let ok=false;
  const timer=setTimeout(()=>{ if(!ok){ busy(false); toast(t('connFail')); leaveNet(); } },15000);
  peer.on('open',id=>{
    NET.id=id; const conn=peer.connect(PREFIX+code,{reliable:true}); NET.conn=conn;
    conn.on('open',()=>{ conn.send({k:'hello',name:myName(),lang:L}); });
    conn.on('data',d=>{
      lastSeen.set('host',Date.now());
      if(d.k==='ping') return;
      if(d.k==='bye'){ hostGone(); return; }
      if(d.k==='welcome'){ ok=true; clearTimeout(timer); busy(false); NET.role='guest'; NET.code=d.code; chat=d.chat||[]; history.replaceState(null,'','?room='+d.code+(qs.get('peerhost')?`&peerhost=${qs.get('peerhost')}&peerport=${qs.get('peerport')||9000}`:'')); startHeartbeat(); go('lobby'); }
      else if(d.k==='state'){ const wasStarted=S.started, oldCat=S.cat; S=d.s; if(S.cat!==oldCat&&S.cat==='hot') {} if(S.started&&!wasStarted) go('game'); else renderAll(); }
      else if(d.k==='chat') addMsg(d.m);
      else if(d.k==='talk') setTalk(d.id,d.on);
    });
    conn.on('close',()=>hostGone());
  });
  peer.on('call',onCall);
  peer.on('error',e=>{ clearTimeout(timer); busy(false); toast(e.type==='peer-unavailable'?t('noRoom'):t('connFail')); if(!ok) leaveNet(); });
}
function leaveNet(){
  clearInterval(hbTimer); lastSeen.clear();
  try{ if(NET.role==='host') broadcast({k:'bye'}); else if(NET.conn&&NET.conn.open) NET.conn.send({k:'bye'}); }catch(e){}
  stopVoice(true);
  try{NET.conn&&NET.conn.close()}catch(e){} try{NET.peer&&NET.peer.destroy()}catch(e){}
  Object.assign(NET,{role:null,peer:null,conn:null,id:null,code:null}); NET.conns=new Map(); talking.clear();
  if(location.search.includes('room=')) history.replaceState(null,'',location.pathname+(qs.get('peerhost')?`?peerhost=${qs.get('peerhost')}&peerport=${qs.get('peerport')||9000}`:''));
}
function leave(){ if(!confirm(t('confirmLeave'))) return; leaveNet(); S=freshState(); go('home'); }

/* ───────── chat with translation ───────── */
let chat=[], unread=0, chatOpen=false, autoTr=store.get('autotr',true);
const trCache=new Map();
function sys(key,name){ addMsg({id:Date.now()+Math.random(),sys:key,name}); if(NET.role==='host') broadcast({k:'chat',m:{id:Date.now()+Math.random(),sys:key,name}}); }
function addMsg(m){ chat.push(m); if(chat.length>300) chat.shift(); if(!m.sys&&m.from!==NET.id){ if(!chatOpen){unread++; beep('msg'); buzz(20);} if(cur==='game'&&!chatOpen) toast(`${m.name}: ${m.text.slice(0,60)}`);} renderChat(); renderBadges(); }
async function translate(text,to,from){
  const key=to+'|'+text; if(trCache.has(key)) return trCache.get(key);
  let out=null;
  try{ const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${to}&dt=t&q=${encodeURIComponent(text)}`); const j=await r.json(); out=j[0].map(x=>x[0]).join(''); }
  catch(e){ try{ const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from&&from!==to?from:'en'}|${to}`); const j=await r.json(); out=j.responseData&&j.responseData.translatedText; }catch(e2){} }
  if(out) trCache.set(key,out); return out;
}
function renderChat(){
  const box=$('#msgs'); if(!box) return;
  if(!chat.length){ box.innerHTML=`<p class="chat-empty">${t('emptyChat')}</p>`; return; }
  const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
  box.innerHTML=chat.map(m=>{
    if(m.sys) return `<div class="msg sys">${esc(t(m.sys,{name:m.name}))}</div>`;
    const mine=m.from===NET.id; const tr=trCache.get(L+'|'+m.text); const showTr=!mine&&tr&&tr.trim().toLowerCase()!==m.text.trim().toLowerCase()&&(autoTr||m.wantTr)&&!m.orig;
    const body=showTr?`${esc(tr)}<div class="orig">${esc(m.text)}</div>`:esc(m.text);
    const ctl=mine?'':(m.loading?`<span>${t('translating')}</span>`:showTr?`<button data-orig="${m.id}">${t('showOrig')}</button>`:(m.fail?`<span>${t('trFail')}</span>`:`<button data-tr="${m.id}">${t('translate')}</button>`));
    return `<div class="msg ${mine?'mine':''}"><span class="by">${esc(m.name)} · ${LANG_NAMES[m.lang]||''}</span><div class="bub">${body}</div>${mine?'':`<div class="tr">${ctl}</div>`}</div>`;
  }).join('');
  if(atBottom||chatOpen) box.scrollTop=box.scrollHeight;
  if(autoTr) chat.forEach(m=>{ if(!m.sys&&m.from!==NET.id&&m.lang!==L&&!m.tried){ m.tried=true; doTr(m); } });
}
async function doTr(m){ m.loading=true; m.orig=false; m.wantTr=true; renderChatSoon(); const r=await translate(m.text,L,m.lang); m.loading=false; if(!r) m.fail=true; renderChatSoon(); }
let rcT; const renderChatSoon=()=>{clearTimeout(rcT);rcT=setTimeout(renderChat,30)};
function sendChat(txt){
  const text=(txt??$('#chatIn').value).trim(); if(!text||!NET.role) return;
  $('#chatIn').value=''; autosize();
  if(NET.role==='host'){ const p=S.players[0]; const m={id:Date.now()+Math.random(),from:NET.id,name:p.name,lang:L,text:text.slice(0,600)}; addMsg(m); broadcast({k:'chat',m}); }
  else NET.conn&&NET.conn.open&&NET.conn.send({k:'chat',text});
  beep('tap');
}
function openChat(){ unread=0; chatOpen=true; openSheet('chatSheet'); chatOpen=true; renderChat(); renderBadges(); $('#trSw').classList.toggle('on',autoTr); $('#quick').innerHTML=['👋','😂','🔥','😳','❤️','👏','🙈','😈'].map(e=>`<button data-quick="${e}">${e}</button>`).join(''); setTimeout(()=>{ $('#msgs').scrollTop=1e6; },50); }
function autosize(){ const a=$('#chatIn'); a.style.height='auto'; a.style.height=Math.min(a.scrollHeight,130)+'px'; }

/* ───────── voice: walkie-talkie or open mic over WebRTC ───────── */
const V={on:false,stream:null,mode:store.get('vmode','ptt'),calls:new Map(),audios:new Map(),pressed:false};
const talking=new Set();
async function startVoice(){
  if(!NET.role) return;
  try{ V.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ toast(t('micDenied')); return; }
  V.on=true; setMic(V.mode==='open');
  sendAct({a:'voice',on:true});
  S.players.forEach(p=>{ if(p.id!==NET.id&&p.v) callPeer(p.id); });
  renderAll(); beep('card');
}
function stopVoice(silent){
  if(V.stream) V.stream.getTracks().forEach(tr=>tr.stop());
  V.stream=null; V.on=false; V.pressed=false;
  [...V.calls.keys()].forEach(hangup);
  if(!silent&&NET.role){ sendAct({a:'voice',on:false}); sendTalk(false); }
  renderVoice();
}
function setMic(on){ if(V.stream) V.stream.getAudioTracks().forEach(tr=>tr.enabled=on); }
function callPeer(id){ if(!NET.peer||V.calls.has(id)) return; const call=NET.peer.call(id,V.stream); if(call) wireCall(call); }
function onCall(call){ if(!V.on){ call.close(); return; } call.answer(V.stream); wireCall(call); }
function wireCall(call){
  V.calls.set(call.peer,call);
  call.on('stream',rs=>{ let a=V.audios.get(call.peer); if(!a){a=new Audio(); a.autoplay=true; a.playsInline=true; V.audios.set(call.peer,a); document.body.appendChild(a);} a.srcObject=rs; a.play().catch(()=>{}); });
  call.on('close',()=>hangup(call.peer)); call.on('error',()=>hangup(call.peer));
}
function hangup(id){ const c=V.calls.get(id); V.calls.delete(id); try{c&&c.close()}catch(e){} const a=V.audios.get(id); if(a){a.srcObject=null;a.remove();V.audios.delete(id);} }
function sendTalk(on){ if(NET.role==='host'){ setTalk(NET.id,on); broadcast({k:'talk',id:NET.id,on}); } else if(NET.conn&&NET.conn.open){ NET.conn.send({k:'talk',on}); setTalk(NET.id,on); } }
function setTalk(id,on){ const had=talking.has(id); on?talking.add(id):talking.delete(id); renderVoice(); if(had!==!!on&&cur==='game') renderScoresBar(); }
function pttDown(e){ e.preventDefault(); if(!V.on||V.mode!=='ptt'||V.pressed) return; V.pressed=true; setMic(true); sendTalk(true); buzz(25); renderVoice(); }
function pttUp(){ if(!V.pressed) return; buzz(10); V.pressed=false; setMic(false); sendTalk(false); renderVoice(); }
function renderVoice(){
  const others=S.players.filter(p=>talking.has(p.id)&&p.id!==NET.id).map(p=>t('isTalking',{name:p.name}));
  const inV=S.players.filter(p=>p.v).map(p=>p.name), live=V.mode==='open'||V.pressed;
  ['#vdock','#vdockLobby'].forEach(sel=>{ const d=$(sel); if(!d) return; d.classList.toggle('on',V.on);
    if(!V.on){ d.innerHTML=''; return; }
    if(!d.firstChild) d.innerHTML=`<button class="ptt" data-ptt></button><div class="vinfo"><span class="st"></span><span class="who"></span><div class="seg"><button data-vmode="ptt"></button><button data-vmode="open"></button><button data-act="voiceOff" aria-label="off">✕</button></div></div>`;
    const btn=d.querySelector('.ptt'); btn.className='ptt'+(V.mode==='open'?' open':'')+(V.pressed?' live':''); btn.textContent=V.mode==='open'?'🔴':'🎙'; btn.setAttribute('aria-label',t('holdTalk'));
    d.querySelector('.st').textContent=live?t('talkingNow'):(V.mode==='ptt'?t('holdTalk'):t('openMic'));
    d.querySelector('.who').textContent=others.join(' · ')||('🎧 '+inV.join(', '));
    const [b1,b2]=d.querySelectorAll('[data-vmode]'); b1.textContent='📻 '+t('ptt'); b2.textContent='🎤 '+t('openMic');
    b1.classList.toggle('sel',V.mode==='ptt'); b2.classList.toggle('sel',V.mode==='open');
  });
  const vb=$('#voiceBtnLobby'); if(vb) vb.style.display=(NET.role&&!V.on)?'':'none';
  const vi=$('#voiceIcon'); if(vi) vi.style.background=V.on?'var(--light)':'';
}
/* ───────── custom cards ───────── */
let addCat='light', addTy='t';
function openAddQ(){ openSheet('addSheet'); renderAdd(); }
function renderAdd(){
  $('#addCats').innerHTML=CATS.map(c=>`<button class="cat ${addCat===c?'sel':''}" data-addcat="${c}" style="background:var(--${c});min-height:64px;padding:8px;align-items:center;justify-content:center"><b style="font-size:.82rem;text-align:center">${EMO[c]}<br>${t('cat_'+c)}</b></button>`).join('');
  $('#addType').innerHTML=`<button class="btn ${addTy==='t'?'main':''}" data-addty="t">${t('truth')}</button><button class="btn ${addTy==='d'?'main':''}" data-addty="d">${t('dare')}</button>`;
}
function saveQ(){ const x=$('#addText').value.trim(); if(x.length<3){$('#addText').focus();return;} (custom[addCat]=custom[addCat]||[]).push({ty:addTy,x}); store.set('custom',custom); delete decks[addCat+addTy]; $('#addText').value=''; toast(t('saved')); closeSheets(); renderAll(); }

/* ───────── events ───────── */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-go],[data-lang],[data-cat],[data-pick],[data-del],[data-tr],[data-orig],[data-quick],[data-vmode],[data-addcat],[data-addty]'); if(!el) return;
  const d=el.dataset;
  if(d.go){ beep('tap'); go(d.go); if(d.go==='online'){ $('#myName').value=store.get('myname',''); } return; }
  if(d.lang) return setLang(d.lang);
  if(d.cat) return chooseCat(d.cat);
  if(d.pick) return act({a:'pick',ty:d.pick});
  if(d.del!=null){ $$('#localList input').forEach(i=>localNames[+i.dataset.pi]=i.value); localNames.splice(+d.del,1); renderSetup(); return; }
  if(d.tr){ const m=chat.find(x=>String(x.id)===d.tr); if(m){m.fail=false; doTr(m);} return; }
  if(d.orig){ const m=chat.find(x=>String(x.id)===d.orig); if(m){m.orig=true; m.wantTr=false; renderChat();} return; }
  if(d.quick) return sendChat(d.quick);
  if(d.vmode){ V.mode=d.vmode; store.set('vmode',V.mode); setMic(V.mode==='open'); sendTalk(V.mode==='open'); renderVoice(); return; }
  if(d.addcat){ addCat=d.addcat; renderAdd(); return; }
  if(d.addty){ addTy=d.addty; renderAdd(); return; }
  switch(d.act){
    case 'rules': modal(`<h3>${t('rules')}</h3><p>${t('rulesText')}</p><p>${t('online_hint')}</p><button class="btn main" data-act="closeModal">OK</button>`); break;
    case 'closeModal': closeModal(); break;
    case 'addLocal': $$('#localList input').forEach(i=>localNames[+i.dataset.pi]=i.value); if(localNames.length<12){localNames.push('');renderSetup(); const ins=$$('#localList input'); ins[ins.length-1].focus();} break;
    case 'localStart': startLocal(); break;
    case 'create': createRoom(); break;
    case 'join': joinRoom(); break;
    case 'share': { const url=location.origin+location.pathname+'?room='+NET.code+(qs.get('peerhost')?`&peerhost=${qs.get('peerhost')}&peerport=${qs.get('peerport')||9000}`:''); const txt=`${t('name')} — ${t('roomCode')}: ${NET.code}`;
      if(navigator.share) navigator.share({title:t('name'),text:txt,url}).catch(()=>{}); else navigator.clipboard.writeText(txt+'\n'+url).then(()=>toast(t('copied'))).catch(()=>toast(url)); } break;
    case 'lobbyStart': if(S.players.length>=2) go('cats'); break;
    case 'catsBack': if(NET.role) go(S.started?'game':'lobby'); else go('setup'); break;
    case 'changeCat': if(NET.role==='guest'){toast(t('waitHost'));break;} renderCats('#catGrid2'); openSheet('catSheet'); break;
    case 'leave': leave(); break;
    case 'chat': openChat(); break;
    case 'closeSheets': closeSheets(); break;
    case 'send': sendChat(); break;
    case 'autoTr': autoTr=!autoTr; store.set('autotr',autoTr); $('#trSw').classList.toggle('on',autoTr); chat.forEach(m=>{m.tried=false;m.orig=false;}); renderChat(); break;
    case 'voice': V.on?stopVoice():startVoice(); break;
    case 'voiceOff': stopVoice(); break;
    case 'scores': renderScores(); openSheet('scoreSheet'); break;
    case 'reset': act({a:'reset'}); closeSheets(); break;
    case 'prev': goPrev(); renderGame(); break;
    case 'next': if(viewIdx!=null){ viewIdx++; if(viewIdx>=S.hist.length-(S.card?1:0)) viewIdx=null; } renderGame(); break;
    case 'live': viewIdx=null; renderGame(); break;
    case 'done': case 'pass': case 'skip': act({a:d.act}); break;
    case 'ageYes': ageOk=true; closeModal(); ageCb&&ageCb.ok(); ageCb=null; break;
    case 'ageNo': closeModal(); ageCb&&ageCb.no(); ageCb=null; break;
    case 'openAddQ': openAddQ(); break;
    case 'saveQ': saveQ(); break;
  }
});
// push-to-talk needs press-and-hold
document.addEventListener('pointerdown',e=>{ const b=e.target.closest('[data-ptt]'); if(!b) return; try{b.setPointerCapture(e.pointerId)}catch(_){} pttDown(e); });
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>pttUp(),true));
document.addEventListener('keydown',e=>{ if(e.code==='Space'&&V.on&&V.mode==='ptt'&&document.activeElement&&document.activeElement.tagName!=='TEXTAREA'&&document.activeElement.tagName!=='INPUT'){ e.preventDefault(); if(!V.pressed) pttDown(e); } });
document.addEventListener('keyup',e=>{ if(e.code==='Space') pttUp(); });
window.addEventListener('blur',()=>pttUp());
document.addEventListener('contextmenu',e=>{ if(e.target.closest('[data-ptt]')) e.preventDefault(); });
document.addEventListener('input',e=>{ if(e.target.dataset.pi!=null) localNames[+e.target.dataset.pi]=e.target.value; if(e.target.id==='chatIn') autosize(); if(e.target.id==='myName') e.target.style.borderColor=''; });
$('#chatIn').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendChat(); } });
$('#codeIn').addEventListener('keydown',e=>{ if(e.key==='Enter') joinRoom(); });
// swipe the card to move through earlier cards
(()=>{ let x0=null; const c=$('#card');
  c.addEventListener('pointerdown',e=>{x0=e.clientX}); c.addEventListener('pointerup',e=>{ if(x0==null) return; let dx=e.clientX-x0; x0=null; if(Math.abs(dx)<60||maxReview()<0) return; if(L==='ar') dx=-dx;
    if(dx>0){ goPrev(); } else if(viewIdx!=null){ viewIdx++; if(viewIdx>=S.hist.length-(S.card?1:0)) viewIdx=null; }
    beep('tap'); renderGame(); }); })();
window.addEventListener('pagehide',()=>{ try{ if(NET.role==='host') broadcast({k:'bye'}); else if(NET.conn&&NET.conn.open) NET.conn.send({k:'bye'}); NET.peer&&NET.peer.destroy(); }catch(e){} });

/* ───────── boot ───────── */
applyLang();
if(qs.get('room')){ go('online'); $('#codeIn').value=qs.get('room').toUpperCase(); $('#myName').value=store.get('myname',''); if($('#myName').value) setTimeout(()=>joinRoom(qs.get('room')),300); else $('#myName').focus(); }
</script>
